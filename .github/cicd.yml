name: Production Kubernetes Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Automated Tests
      run: python -m pytest app/test_app.py

    - name: Docker Hub Authentication
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Dynamic Image Tag
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/library-app:latest
          ${{ secrets.DOCKER_USERNAME }}/library-app:${{ github.sha }}

    - name: Deploy Manifest Updates to Cluster
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/library-app:${{ github.sha }}|g" k8s/deployment.yml
        kubectl apply -f k8s/deployment.yml

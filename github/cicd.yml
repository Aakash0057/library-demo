name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  cicd-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest app/test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true

        tags: |
          ${{ secrets.DOCKER_USERNAME }}/library-app:latest
          ${{ secrets.DOCKER_USERNAME }}/library-app:${{ github.sha }}

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config

    - name: Update Deployment Image Tag
      run: |
        sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/library-app:${{ github.sha }}|g" k8s/deployment.yml

    - name: Deploy to Kubernetes Cluster
      run: |
        kubectl apply -f k8s/deployment.yml
